<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Incerto</title>
<style>
  @font-face { font-family: "P"; src: url("fonts/pagella-regular.woff2") format("woff2"); }
  @font-face { font-family: "P"; font-style: italic; src: url("fonts/pagella-italic.woff2") format("woff2"); }
  @font-face { font-family: "P"; font-weight: 700; src: url("fonts/pagella-bold.woff2") format("woff2"); }
  @font-face { font-family: "G"; src: url("fonts/goudy-initialen.woff2") format("woff2"); }
  :root { --ink: #111; --maroon: #8f3838; --callout: #fffddb; --rule: #f2e33a; --muted: #666; --hair: #ddd; }
  body { margin: 0; width: 300px; font: 15px/1.4 P, Palatino, serif; color: var(--ink); background: #fff;
         font-feature-settings: "onum", "kern"; }
  header { display: flex; align-items: center; gap: .55rem; padding: 14px 16px 10px; border-bottom: .6px solid var(--hair); }
  .initial { font: 2.1rem/0.8 G; color: var(--maroon); height: .8em; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 400; color: var(--maroon); font-variant-caps: small-caps; text-transform: lowercase; letter-spacing: .1em; }
  h1 + p { margin: 0; font-size: .82rem; font-style: italic; color: var(--muted); }
  section { padding: 10px 16px 4px; }
  h2 { margin: 0 0 .35rem; font-size: .88rem; font-weight: 400; color: var(--maroon); font-variant-caps: small-caps; text-transform: lowercase; letter-spacing: .09em; }
  label.opt { display: grid; grid-template-columns: 1.1rem 1fr; column-gap: .3rem; padding: .3rem .45rem; margin: 0 -.45rem; border-radius: 2px; cursor: pointer; }
  label.opt:hover { background: var(--callout); }
  label.opt input { margin: .28rem 0 0; accent-color: var(--maroon); }
  label.opt b { font-weight: 700; }
  label.opt span { grid-column: 2; font-size: .8rem; font-style: italic; color: var(--muted); line-height: 1.3; }
  .hint { margin: 0; padding: 10px 16px 0; font-size: .85rem; font-style: italic; color: var(--muted); }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 12px; border-top: .6px solid var(--hair); margin-top: 8px; }
  .toggle input { accent-color: var(--maroon); width: 1rem; height: 1rem; }
</style>
</head>
<body>
<header><span class="initial">I</span><div><h1>Incerto</h1><p>for Wikipedia</p></div></header>

<p class="hint">Select text in an article to highlight it or add a margin note.</p>

<label class="toggle"><span>Typesetting on</span><input type="checkbox" name="enabled"></label>
<script src="popup.js"></script>
</body>
</html>
